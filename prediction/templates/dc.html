{% extends "base.html" %}


{% block title %}画像判定アプリ{% endblock %}
{% block content %}

<div class="container py-5 text-center">
        <h2 class="mb-4">犬か猫かを画像判定します</h2>
        <form method="post" enctype="multipart/form-data">
            <div class="mb-3">
                {% csrf_token %}
                {{ form.as_p }}
                <input id="img_data" type="hidden" name="img_data" />
            </div>
            <img id="preview" style="display: none;" class="img-fluid mb-3" />
            <div class="mb-3">
                <button type="button" onclick="clearimg()" class="btn btn-success btn-lg">クリア</button>
                <button type="submit" class="btn btn-primary btn-lg">判定</button>
            </div>
        </form>
        {% if prediction %}
        <div id="prediction">
            <h2 class="mb-4">判定結果</h2>
            <p>あなたのアップロードした画像は「<strong>{{ prediction }}</strong>」でしょう。</p>
            <img src="{{ img_data }}" class="img-fluid mb-3">
        </div>
        {% endif %}
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script>
        $(function () {
            $('#id_image').on('change', function () {
                var reader = new FileReader();
                reader.onload = function () {
                    $("#preview").attr('src', reader.result);
                    $("#preview").show();
                    $("#img_data").val(reader.result);
                }
                reader.readAsDataURL(this.files[0]);
                $("#prediction").text('');
            });
        });
        function clearimg() {
            $('#id_image').val('');       // Clear uploaded file
            $('#preview').attr('src', ''); // Clear preview image
            $('#preview').show();         // refresh preview
        }
    </script>
{% endblock %}
